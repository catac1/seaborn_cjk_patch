[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
 
[project]
name = "seaborn-cjk"
version = "0.1.0"
description = "Automatically patch seaborn/matplotlib so CJK characters render correctly in legends and all text"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.8"
dependencies = [
    "matplotlib>=3.6",   # 3.6 introduced per-glyph font fallback
]
keywords = ["matplotlib", "seaborn", "CJK", "Chinese", "Japanese", "Korean", "font"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
 
[project.optional-dependencies]
seaborn = ["seaborn>=0.11"]
dev = ["pytest", "seaborn", "matplotlib"]
 
[project.urls]
Repository = "https://github.com/yourname/seaborn-cjk"
 
[tool.setuptools.packages.find]
where = ["."]
include = ["seaborn_cjk*"]
